<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circularia — Evaluación de sostenibilidad en etapa de diseño</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ============ TOKENS ============ */
:root{
  --env:#a8e63d;
  --eco:#6b6ef5;
  --soc:#2de8a8;
  --chart-bg-dark:#131926;

  --bg:#f2f1ec;
  --surface:#ffffff;
  --text:#111214;
  --text-muted:#5b5e66;
  --border:#d7d5cc;

  --danger:#c23a3a;
  --radius:2px;
}
html[data-theme="dark"]{
  --bg:#0d0f14;
  --surface:#161a22;
  --text:#f3f4f2;
  --text-muted:#a1a5af;
  --border:#2a2f3a;
}

/* ============ BASE / RESET ============ */
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:'Bai Jamjuree',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-weight:400;
  -webkit-font-smoothing:antialiased;
}
button,input{font-family:inherit;}
h1,h2,h3,h4,p,ol,ul{margin:0;}
button{cursor:pointer;}
*:focus-visible{outline:2px solid var(--eco);outline-offset:2px;}
.panel-chart *:focus-visible{outline-color:var(--soc);}

/* ============ LAYOUT ============ */
#app{display:flex;flex-direction:column;height:100vh;}

.app-header{
  display:flex;align-items:center;gap:24px;
  padding:14px 24px;
  border-bottom:1px solid var(--border);
  background:var(--surface);
  flex-shrink:0;
}
.logo{
  font-weight:700;font-size:18px;letter-spacing:0.08em;
  white-space:nowrap;
}
.theme-toggle{
  margin-left:auto;flex-shrink:0;
  background:transparent;border:1px solid var(--border);color:var(--text);
  padding:8px 14px;font-size:13px;font-weight:500;border-radius:var(--radius);
}
.theme-toggle:hover{border-color:var(--text);}

.stepper{
  list-style:none;padding:0;margin:0;
  display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0;
}
.step{
  display:flex;align-items:center;gap:8px;
  background:transparent;border:1px solid var(--border);color:var(--text-muted);
  padding:7px 12px;border-radius:var(--radius);font-size:12.5px;font-weight:500;
  white-space:nowrap;
}
.step-index{
  display:inline-flex;align-items:center;justify-content:center;
  width:18px;height:18px;border-radius:50%;border:1px solid currentColor;font-size:11px;flex-shrink:0;
}
.step--current{color:var(--text);border-color:var(--text);}
.step--current .step-index{background:var(--text);color:var(--bg);border-color:var(--text);}
.step--complete{color:var(--eco);border-color:var(--eco);}
.step--complete .step-index{background:var(--eco);color:#fff;border-color:var(--eco);}

.split{flex:1;display:flex;min-height:0;}
.panel{overflow-y:auto;}
.panel-form{
  flex:1 1 50%;min-width:0;
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  background:var(--bg);
}
.form-scroll{padding:28px;flex:1;overflow-y:auto;}
.form-nav{
  display:flex;justify-content:space-between;align-items:center;
  padding:16px 28px;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0;
}

.panel-chart{
  flex:1 1 50%;min-width:0;
  background:var(--chart-bg-dark);
  color:#f5f6f4;
  padding:28px;
  --pc-muted:#a7abb5;
  --pc-border:rgba(255,255,255,0.14);
}

@media (max-width:900px){
  .split{flex-direction:column;}
  .panel-form{border-right:none;border-bottom:1px solid var(--border);flex:none;}
  .panel-chart{flex:none;}
  .app-header{flex-wrap:wrap;}
}

/* ============ FORM ELEMENTS ============ */
.form-title{font-size:22px;font-weight:700;margin-bottom:6px;}
.form-lead{color:var(--text-muted);font-size:13.5px;margin-bottom:20px;}
.panel-subtitle{font-size:15px;font-weight:600;margin:24px 0 10px;color:var(--pc-muted);}
.panel-title{font-size:20px;font-weight:700;margin-bottom:14px;color:#fff;}

.field{margin-bottom:22px;}
.field label,.field-label{display:block;font-size:13px;font-weight:600;margin-bottom:8px;}
.req{color:var(--danger);}
.field input[type="text"]{
  width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--surface);color:var(--text);font-size:14px;
}
.field input[type="text"]:focus-visible{outline-offset:0;}

.chip-group{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  padding:7px 13px;font-size:13px;font-weight:500;border-radius:var(--radius);
}
.chip:hover{border-color:var(--text);}
.chip.is-selected{background:var(--text);color:var(--bg);border-color:var(--text);}

.hashtag-box{
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  border:1px solid var(--border);border-radius:var(--radius);padding:8px;background:var(--surface);
}
.hashtag-chip{
  display:inline-flex;align-items:center;gap:4px;
  border:1px solid var(--border);border-radius:var(--radius);padding:3px 4px 3px 9px;
  font-size:12.5px;color:var(--text);
}
.hashtag-remove{
  background:none;border:none;color:var(--text-muted);font-size:14px;line-height:1;padding:2px 5px;
}
.hashtag-remove:hover{color:var(--danger);}
#hashtagInput{
  border:none;outline:none;background:transparent;color:var(--text);font-size:13px;
  flex:1;min-width:120px;padding:4px;
}

.form-error{
  color:var(--danger);font-size:13px;font-weight:500;
  border:1px solid var(--danger);border-radius:var(--radius);padding:8px 12px;margin-top:4px;
}

.decisions{display:flex;flex-direction:column;gap:26px;}
.decision-title{font-size:15px;font-weight:600;margin-bottom:10px;}
.decision-feedback{min-height:18px;font-size:12.5px;color:var(--text-muted);margin-top:8px;}

.btn{
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  padding:10px 18px;font-size:13.5px;font-weight:500;border-radius:var(--radius);
}
.btn:hover{border-color:var(--text);}
.btn--primary{background:var(--text);color:var(--bg);border-color:var(--text);}
.btn--danger{color:var(--danger);border-color:var(--danger);}
.btn--danger:hover{background:var(--danger);color:#fff;}

.results-block{margin-bottom:26px;}
.results-block h3{font-size:15px;font-weight:600;margin-bottom:10px;}
.critical-list{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px;}
.critical-list li{
  display:flex;flex-direction:column;gap:2px;
  border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;font-size:13px;
}
.critical-stage{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);}
.critical-score{font-weight:700;color:var(--danger);}
.empty-note{color:var(--text-muted);font-size:13px;}

.results-actions{display:flex;flex-direction:column;gap:12px;align-items:flex-start;}
.io-row{display:flex;gap:10px;}
.reset-confirm{
  border:1px solid var(--danger);border-radius:var(--radius);padding:12px;
  display:flex;flex-direction:column;gap:10px;font-size:13px;
}
.reset-confirm p{margin:0;}
.reset-confirm div{display:flex;gap:8px;}

/* ============ CHART PANEL ============ */
.empty-state{
  height:100%;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
  max-width:420px;
}
.empty-state-title{font-size:32px;font-weight:700;margin-bottom:14px;}
.empty-state-copy{color:var(--pc-muted);font-size:15px;line-height:1.5;}

.chart-toolbar{margin-bottom:16px;}
.segmented{display:inline-flex;border:1px solid var(--pc-border);border-radius:var(--radius);overflow:hidden;}
.seg-btn{
  background:transparent;border:none;color:var(--pc-muted);padding:8px 16px;font-size:13px;font-weight:500;
}
.seg-btn.is-active{background:#fff;color:#111214;}
.seg-btn + .seg-btn{border-left:1px solid var(--pc-border);}

.chart-canvas-wrap{position:relative;width:100%;height:400px;}
.chart-canvas-wrap--lg{height:440px;}
.chart-canvas-wrap--sm{height:210px;}

.dim-indicators{display:flex;gap:14px;margin-top:18px;flex-wrap:wrap;}
.dim-indicator{
  flex:1;min-width:130px;border:1px solid var(--pc-border);border-radius:var(--radius);padding:10px 12px;
}
.dim-indicator-label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--pc-muted);margin-bottom:4px;}
.dim-indicator-value{display:block;font-size:18px;font-weight:700;}
.dim-indicator-state{display:block;font-size:12px;color:var(--pc-muted);text-transform:capitalize;}
.dim-indicator--env .dim-indicator-value{color:var(--env);}
.dim-indicator--eco .dim-indicator-value{color:var(--eco);}
.dim-indicator--soc .dim-indicator-value{color:var(--soc);}

.stage-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:12px;}
.stage-grid-item h4{font-size:13px;font-weight:600;margin-bottom:8px;color:var(--pc-muted);}
@media (max-width:600px){.stage-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div id="app">
  <header class="app-header">
    <div class="logo">CIRCULARIA</div>
    <div id="stepperWrap"></div>
    <button type="button" id="themeToggle" class="theme-toggle" aria-pressed="false">Modo oscuro</button>
  </header>
  <main class="split">
    <section id="panelForm" class="panel panel-form" aria-label="Formulario de evaluación"></section>
    <section id="panelChart" class="panel panel-chart" aria-label="Visualización de impacto"></section>
  </main>
</div>

<script>
/* ============ DATA ============ */
const BASE = 5;
const RANGE = 8;

const AXES = [
  { id:'materiales', label:'Materiales', dim:'env' },
  { id:'energia', label:'Energía', dim:'env' },
  { id:'residuos', label:'Residuos', dim:'env' },
  { id:'costo', label:'Costo', dim:'eco' },
  { id:'sobreproduccion', label:'Sobreproducción', dim:'eco' },
  { id:'vidaUtil', label:'Vida útil comercial', dim:'eco' },
  { id:'condicionesLaborales', label:'Condiciones laborales', dim:'soc' },
  { id:'cadenaLocal', label:'Cadena local', dim:'soc' },
  { id:'accesoUso', label:'Acceso y uso', dim:'soc' }
];

const CATEGORY_OPTIONS = {
  tipoProducto: [
    {id:'vestuario', label:'Vestuario'},
    {id:'accesorio', label:'Accesorio'},
    {id:'mobiliario', label:'Mobiliario'},
    {id:'objeto', label:'Objeto'},
    {id:'packaging', label:'Packaging'},
    {id:'editorial', label:'Editorial'}
  ],
  escala: [
    {id:'pieza-unica', label:'Pieza única'},
    {id:'serie-corta', label:'Serie corta'},
    {id:'serie-media', label:'Serie media'},
    {id:'industrial', label:'Industrial'}
  ],
  mercado: [
    {id:'local', label:'Local'},
    {id:'nacional', label:'Nacional'},
    {id:'regional-latam', label:'Regional LATAM'},
    {id:'exportacion', label:'Exportación'}
  ]
};
const CATEGORY_GROUPS = Object.keys(CATEGORY_OPTIONS);

const STAGES = [
  { id:'diseno', label:'Diseño', decisions:[
    { id:'material', label:'Material principal', options:[
      {id:'reciclado', label:'Reciclado o reutilizado', impact:{materiales:-2, residuos:-1}},
      {id:'monovirgen', label:'Monomaterial virgen certificado', impact:{costo:1}},
      {id:'mezcla', label:'Mezcla no separable', impact:{materiales:2, residuos:2}}
    ]},
    { id:'desmontaje', label:'Diseño para desmontaje', options:[
      {id:'total', label:'Total', impact:{residuos:-2, materiales:-1}},
      {id:'parcial', label:'Parcial', impact:{residuos:-1}},
      {id:'ninguno', label:'Ninguno', impact:{residuos:1, materiales:1}}
    ]},
    { id:'componentes', label:'Cantidad de componentes y procesos', options:[
      {id:'minima', label:'Mínima', impact:{energia:-1, costo:-1, residuos:-1}},
      {id:'media', label:'Media', impact:{}},
      {id:'alta', label:'Alta', impact:{energia:2, costo:1, residuos:1}}
    ]},
    { id:'modular', label:'Diseño modular o actualizable', options:[
      {id:'si', label:'Sí', impact:{vidaUtil:-2, residuos:-1, accesoUso:-1}},
      {id:'parcialMod', label:'Parcial', impact:{vidaUtil:-1}},
      {id:'no', label:'No', impact:{vidaUtil:1, residuos:1}}
    ]}
  ]},
  { id:'produccion', label:'Producción', decisions:[
    { id:'modeloProduccion', label:'Modelo de producción', options:[
      {id:'demanda', label:'Bajo demanda', impact:{sobreproduccion:-2, residuos:-1, costo:1}},
      {id:'preventa', label:'Preventa', impact:{sobreproduccion:-1}},
      {id:'stock', label:'Stock por temporada', impact:{sobreproduccion:2, residuos:1}}
    ]},
    { id:'proveedores', label:'Proveedores', options:[
      {id:'localesTraz', label:'Locales con trazabilidad', impact:{cadenaLocal:-2, condicionesLaborales:-1, energia:-1}},
      {id:'nacionales', label:'Nacionales', impact:{cadenaLocal:-1}},
      {id:'importados', label:'Importados sin trazabilidad', impact:{cadenaLocal:2, condicionesLaborales:1, energia:1}}
    ]},
    { id:'energiaProceso', label:'Energía del proceso', options:[
      {id:'renovable', label:'Renovable', impact:{energia:-2}},
      {id:'mixta', label:'Mixta', impact:{}},
      {id:'fosil', label:'Fósil', impact:{energia:2}}
    ]},
    { id:'mermas', label:'Gestión de mermas', options:[
      {id:'reintegradas', label:'Reintegradas al proceso', impact:{residuos:-2, costo:-1}},
      {id:'subproducto', label:'Vendidas como subproducto', impact:{residuos:-1}},
      {id:'descartadas', label:'Descartadas', impact:{residuos:2}}
    ]}
  ]},
  { id:'consumo', label:'Consumo', decisions:[
    { id:'durabilidad', label:'Durabilidad esperada', options:[
      {id:'larga', label:'Larga', impact:{vidaUtil:-2, residuos:-1}},
      {id:'mediaDur', label:'Media', impact:{}},
      {id:'corta', label:'Corta, tendencia de temporada', impact:{vidaUtil:2, sobreproduccion:1, residuos:1}}
    ]},
    { id:'reparabilidad', label:'Reparabilidad', options:[
      {id:'servicio', label:'Servicio de reparación ofrecido', impact:{vidaUtil:-2, accesoUso:-2, residuos:-1}},
      {id:'repuestos', label:'Repuestos disponibles', impact:{vidaUtil:-1, accesoUso:-1}},
      {id:'noReparable', label:'No reparable', impact:{vidaUtil:1, residuos:1, accesoUso:1}}
    ]},
    { id:'empaque', label:'Empaque y distribución', options:[
      {id:'retornable', label:'Sin empaque o retornable', impact:{residuos:-2, materiales:-1, costo:-1}},
      {id:'reciclable', label:'Reciclable', impact:{residuos:-1}},
      {id:'unUso', label:'Plástico de un uso', impact:{residuos:2, materiales:1}}
    ]}
  ]},
  { id:'posconsumo', label:'Posconsumo', decisions:[
    { id:'retorno', label:'Programa de retorno', options:[
      {id:'takeback', label:'Take-back activo', impact:{residuos:-2, cadenaLocal:-1, accesoUso:-1}},
      {id:'puntoRecepcion', label:'Punto de recepción', impact:{residuos:-1}},
      {id:'ningunoRet', label:'Ninguno', impact:{residuos:1}}
    ]},
    { id:'inventario', label:'Destino del inventario no vendido', options:[
      {id:'reventaDonacion', label:'Reventa o donación', impact:{sobreproduccion:-2, costo:-1}},
      {id:'outlet', label:'Outlet', impact:{sobreproduccion:-1}},
      {id:'destruccion', label:'Destrucción', impact:{sobreproduccion:2, residuos:1}}
    ]},
    { id:'reciclabilidad', label:'Reciclabilidad al fin de vida', options:[
      {id:'totalRec', label:'Total', impact:{residuos:-2, materiales:-1}},
      {id:'parcialRec', label:'Parcial', impact:{residuos:-1}},
      {id:'nula', label:'Nula', impact:{residuos:2, materiales:1}}
    ]}
  ]}
];

const STEP_LABELS = ['Ficha del proyecto','Etapa de Diseño','Etapa de Producción','Etapa de Consumo','Etapa de Posconsumo','Resultados y reporte'];

/* ============ STATE ============ */
function createInitialState(){
  return {
    ficha:{ nombre:'', equipo:'', categorias:{}, hashtags:[] },
    selections:{},
    activeStep:0,
    view:'global',
    theme:'light',
    ui:{ fichaError:null, confirmingReset:false }
  };
}
let state = createInitialState();
let charts = { main:null, resultRadar:null, bars:{} };

/* ============ SCORING ============ */
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

function findOption(decisionId, optionId){
  for(const stage of STAGES){
    const decision = stage.decisions.find(d=>d.id===decisionId);
    if(decision) return decision.options.find(o=>o.id===optionId) || null;
  }
  return null;
}

function computeAxisValues(s){
  const raw = AXES.map(()=>0);
  Object.entries(s.selections).forEach(([decisionId, optionId])=>{
    const option = findOption(decisionId, optionId);
    if(!option) return;
    AXES.forEach((axis,i)=>{
      const v = option.impact[axis.id];
      if(v) raw[i]+=v;
    });
  });
  return raw.map(v=>clamp(BASE+v, 0, BASE+RANGE));
}

function computeStageDelta(s, stageId){
  const stage = STAGES.find(st=>st.id===stageId);
  const raw = AXES.map(()=>0);
  if(!stage) return raw;
  stage.decisions.forEach(decision=>{
    const optionId = s.selections[decision.id];
    if(!optionId) return;
    const option = decision.options.find(o=>o.id===optionId);
    if(!option) return;
    AXES.forEach((axis,i)=>{
      const v = option.impact[axis.id];
      if(v) raw[i]+=v;
    });
  });
  return raw;
}

function computeDimensionDelta(values){
  const groups={env:[],eco:[],soc:[]};
  AXES.forEach((axis,i)=>groups[axis.dim].push(values[i]-BASE));
  const avg=(arr)=>arr.reduce((a,b)=>a+b,0)/arr.length;
  return { env:avg(groups.env), eco:avg(groups.eco), soc:avg(groups.soc) };
}

function computeCriticalPoints(){
  const items=[];
  STAGES.forEach(stage=>{
    stage.decisions.forEach(decision=>{
      const optId = state.selections[decision.id];
      if(!optId) return;
      const option = decision.options.find(o=>o.id===optId);
      const score = Object.values(option.impact||{}).reduce((a,b)=>a+b,0);
      if(score>0) items.push({ stageLabel: stage.label, decisionLabel: decision.label, optionLabel: option.label, score });
    });
  });
  items.sort((a,b)=>b.score-a.score);
  return items.slice(0,3);
}

/* ============ HELPERS ============ */
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const escapeAttr = escapeHtml;

function axisLabel(id){
  const axis = AXES.find(a=>a.id===id);
  return axis ? axis.label : id;
}

function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const full = h.length===3 ? h.split('').map(c=>c+c).join('') : h;
  const bigint = parseInt(full, 16);
  const r=(bigint>>16)&255, g=(bigint>>8)&255, b=bigint&255;
  return 'rgba('+r+', '+g+', '+b+', '+alpha+')';
}

function fichaValid(){
  const f = state.ficha;
  return !!(f.nombre && f.nombre.trim() && f.categorias.tipoProducto && f.categorias.escala && f.categorias.mercado);
}

function stageDecisionsComplete(stage){
  return stage.decisions.every(d=>state.selections[d.id]);
}

function stepComplete(index){
  if(index===0) return fichaValid();
  if(index>=1 && index<=4) return stageDecisionsComplete(STAGES[index-1]);
  return false;
}

function decisionFeedback(option){
  if(!option) return '';
  const entries = Object.entries(option.impact||{});
  if(entries.length===0) return 'Sin variación en los ejes.';
  const contrae = entries.filter(([,v])=>v<0).map(([k,v])=>axisLabel(k)+' ('+v+')');
  const expande = entries.filter(([,v])=>v>0).map(([k,v])=>axisLabel(k)+' (+'+v+')');
  const parts=[];
  if(contrae.length) parts.push('Contrae: '+contrae.join(', '));
  if(expande.length) parts.push('Expande: '+expande.join(', '));
  return parts.join(' · ');
}

/* ============ CHARTS ============ */
function chartColors(){
  const dark = state.theme==='dark';
  return {
    gridFaint: dark ? 'rgba(255,255,255,0.10)' : 'rgba(255,255,255,0.16)',
    gridStrong: dark ? 'rgba(255,255,255,0.55)' : 'rgba(255,255,255,0.7)',
    angle: dark ? 'rgba(255,255,255,0.14)' : 'rgba(255,255,255,0.2)',
    muted: dark ? '#9195a0' : '#c7c9cf',
    baseLine: dark ? 'rgba(255,255,255,0.45)' : 'rgba(255,255,255,0.55)'
  };
}

function dimColors(){
  const cs = getComputedStyle(document.documentElement);
  return {
    env: cs.getPropertyValue('--env').trim(),
    eco: cs.getPropertyValue('--eco').trim(),
    soc: cs.getPropertyValue('--soc').trim()
  };
}

const dimensionSectorsPlugin = {
  id:'dimensionSectors',
  beforeDraw(chart){
    if(chart.config.type!=='radar') return;
    const r = chart.scales.r;
    if(!r) return;
    const ctx = chart.ctx;
    const cx=r.xCenter, cy=r.yCenter, radius=r.drawingArea;
    const step=(Math.PI*2)/AXES.length;
    const start=-Math.PI/2;
    const dims = dimColors();
    const groups=[{dim:'env',from:0},{dim:'eco',from:3},{dim:'soc',from:6}];
    ctx.save();
    groups.forEach(g=>{
      const a0=start+(g.from-0.5)*step;
      const a1=start+(g.from+2.5)*step;
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,radius,a0,a1);
      ctx.closePath();
      ctx.fillStyle=hexToRgba(dims[g.dim],0.06);
      ctx.fill();
    });
    ctx.restore();
  }
};

function createRadarChart(canvas){
  const values = computeAxisValues(state);
  const colors = chartColors();
  const dims = dimColors();
  const pointColors = AXES.map(a=>dims[a.dim]);
  return new Chart(canvas.getContext('2d'), {
    type:'radar',
    data:{
      labels: AXES.map(a=>a.label),
      datasets:[
        { label:'Línea base', data: AXES.map(()=>BASE), borderColor: colors.baseLine, borderDash:[4,4], borderWidth:1.5, pointRadius:0, fill:false, order:2 },
        { label:'Proyecto', data: values, borderColor:'#ffffff', borderWidth:2, backgroundColor:'rgba(255,255,255,0.12)', pointBackgroundColor: pointColors, pointBorderColor:'#131926', pointBorderWidth:1.5, pointRadius:4, fill:true, order:1 }
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      animation:{ duration:400, easing:'easeOutQuart' },
      scales:{ r:{
        min:0, max:BASE+RANGE,
        ticks:{ stepSize:1, display:false, backdropColor:'transparent' },
        grid:{ circular:false, color:(ctx)=> ctx.tick && ctx.tick.value===BASE ? colors.gridStrong : colors.gridFaint },
        angleLines:{ display:true, color: colors.angle },
        pointLabels:{ color:(ctx)=> pointColors[ctx.index], font:{ family:'Bai Jamjuree', size:12, weight:'500' } }
      }},
      plugins:{ legend:{ display:false }, tooltip:{ enabled:true } }
    },
    plugins:[dimensionSectorsPlugin]
  });
}

function createZoomChart(canvas, stageId){
  const deltas = computeStageDelta(state, stageId);
  const colors = chartColors();
  const dims = dimColors();
  const barColors = AXES.map(a=>dims[a.dim]);
  return new Chart(canvas.getContext('2d'), {
    type:'bar',
    data:{ labels: AXES.map(a=>a.label), datasets:[{ label:'Variación', data: deltas, backgroundColor: barColors, borderWidth:0, borderRadius:2 }] },
    options:{
      indexAxis:'y', responsive:true, maintainAspectRatio:false,
      animation:{ duration:400, easing:'easeOutQuart' },
      scales:{
        x:{ min:-8, max:8, ticks:{ color: colors.muted, stepSize:4 }, grid:{ color:(ctx)=> ctx.tick && ctx.tick.value===0 ? colors.gridStrong : colors.gridFaint } },
        y:{ ticks:{ color:(ctx)=> barColors[ctx.index], font:{ family:'Bai Jamjuree', weight:'500' } }, grid:{ display:false } }
      },
      plugins:{ legend:{ display:false } }
    }
  });
}

function destroyCharts(){
  if(charts.main){ charts.main.destroy(); charts.main=null; }
  if(charts.resultRadar){ charts.resultRadar.destroy(); charts.resultRadar=null; }
  Object.keys(charts.bars).forEach(k=>{ if(charts.bars[k]){ charts.bars[k].destroy(); } });
  charts.bars = {};
}

function applyThemeToCharts(){
  const colors = chartColors();
  const all = [charts.main, charts.resultRadar].concat(Object.values(charts.bars));
  all.forEach(chart=>{
    if(!chart) return;
    if(chart.config.type==='radar'){
      chart.data.datasets[0].borderColor = colors.baseLine;
      chart.options.scales.r.grid.color = (ctx)=> ctx.tick && ctx.tick.value===BASE ? colors.gridStrong : colors.gridFaint;
      chart.options.scales.r.angleLines.color = colors.angle;
    } else if(chart.config.type==='bar'){
      chart.options.scales.x.ticks.color = colors.muted;
      chart.options.scales.x.grid.color = (ctx)=> ctx.tick && ctx.tick.value===0 ? colors.gridStrong : colors.gridFaint;
    }
    chart.update();
  });
}

/* ============ RENDER ============ */
function chipGroupHTML(groupId, options, selectedId, ariaLabel){
  return '<div class="chip-group" role="radiogroup" aria-label="'+escapeAttr(ariaLabel)+'" data-group="'+groupId+'">'
    + options.map((opt,i)=>{
        const checked = opt.id===selectedId;
        const tabIdx = checked ? 0 : (selectedId ? -1 : (i===0 ? 0 : -1));
        return '<button type="button" class="chip'+(checked?' is-selected':'')+'" role="radio" aria-checked="'+checked+'" tabindex="'+tabIdx+'" data-group="'+groupId+'" data-value="'+opt.id+'">'+escapeHtml(opt.label)+'</button>';
      }).join('')
    + '</div>';
}

function stepperHTML(){
  return '<ol class="stepper" role="tablist" aria-label="Pasos de la evaluación">'
    + STEP_LABELS.map((label,i)=>{
        const complete = stepComplete(i);
        const active = state.activeStep===i;
        const status = active ? 'current' : (complete ? 'complete' : 'pending');
        const statusText = status==='complete' ? 'completo' : (status==='current' ? 'en curso' : 'pendiente');
        return '<li><button type="button" class="step step--'+status+'" data-step="'+i+'" role="tab" aria-selected="'+active+'" aria-label="Paso '+(i+1)+': '+escapeAttr(label)+' ('+statusText+')">'
          + '<span class="step-index">'+(complete?'✓':(i+1))+'</span>'
          + '<span class="step-label">'+escapeHtml(label)+'</span>'
          + '</button></li>';
      }).join('')
    + '</ol>';
}

function renderHeader(){
  document.getElementById('stepperWrap').innerHTML = stepperHTML();
  const toggle = document.getElementById('themeToggle');
  toggle.setAttribute('aria-pressed', state.theme==='dark');
  toggle.textContent = state.theme==='dark' ? 'Modo claro' : 'Modo oscuro';
}

function dimensionIndicatorsHTML(values){
  const delta = computeDimensionDelta(values);
  const dims=[['env','Ambiental'],['eco','Económica'],['soc','Social']];
  return '<div class="dim-indicators" aria-live="polite">'
    + dims.map(([key,label])=>{
        const v = delta[key];
        const rounded = Math.round(v*10)/10;
        const st = v<-0.05 ? 'contrae' : (v>0.05 ? 'expande' : 'neutro');
        const sign = v>0 ? '+' : '';
        return '<div class="dim-indicator dim-indicator--'+key+'">'
          + '<span class="dim-indicator-label">'+label+'</span>'
          + '<span class="dim-indicator-value">'+sign+rounded+'</span>'
          + '<span class="dim-indicator-state">'+st+'</span>'
          + '</div>';
      }).join('')
    + '</div>';
}

/* ============ EVENTS ============ */
function normalizeTag(raw){
  return raw.toLowerCase().replace(/#/g,'').replace(/\s+/g,'');
}

function commitHashtag(raw){
  const tag = normalizeTag(raw);
  if(!tag) return;
  if(state.ficha.hashtags.length>=8) return;
  if(state.ficha.hashtags.includes(tag)) return;
  state.ficha.hashtags.push(tag);
  render();
  const input=document.getElementById('hashtagInput');
  if(input) input.focus();
}

function removeLastHashtag(){
  if(state.ficha.hashtags.length===0) return;
  state.ficha.hashtags.pop();
  render();
  const input=document.getElementById('hashtagInput');
  if(input) input.focus();
}

function handleRemoveHashtag(tag){
  state.ficha.hashtags = state.ficha.hashtags.filter(t=>t!==tag);
  render();
  const input=document.getElementById('hashtagInput');
  if(input) input.focus();
}

function handleChipSelect(chipEl){
  const group = chipEl.dataset.group;
  const value = chipEl.dataset.value;
  if(CATEGORY_GROUPS.includes(group)) state.ficha.categorias[group]=value;
  else state.selections[group]=value;
  render();
  const newChip = document.querySelector('.chip[data-group="'+CSS.escape(group)+'"][data-value="'+CSS.escape(value)+'"]');
  if(newChip) newChip.focus();
}

function handleStepClick(index){
  if(index===state.activeStep) return;
  if(state.activeStep===0 && index!==0 && !fichaValid()){
    state.ui.fichaError='Completa el nombre y una opción por categoría antes de continuar.';
    render();
    return;
  }
  state.ui.fichaError=null;
  state.activeStep=index;
  state.view='global';
  render();
}

function handleNext(){ handleStepClick(Math.min(5, state.activeStep+1)); }
function handlePrev(){
  state.activeStep = Math.max(0, state.activeStep-1);
  state.view='global';
  render();
}

function handleViewChange(view){ state.view=view; render(); }

function handleThemeToggle(){
  state.theme = state.theme==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', state.theme);
  renderHeader();
  document.getElementById('themeToggle').focus();
  applyThemeToCharts();
}

function handleExport(){
  const data = { ficha: state.ficha, selections: state.selections, activeStep: state.activeStep, view: state.view, theme: state.theme };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url;
  const safeName = (state.ficha.nombre||'circularia').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'circularia';
  a.download = safeName+'.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function handleImportFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      state.ficha = Object.assign({nombre:'',equipo:'',categorias:{},hashtags:[]}, data.ficha);
      state.selections = data.selections || {};
      state.activeStep = typeof data.activeStep==='number' ? data.activeStep : 0;
      state.view = data.view==='zoom' ? 'zoom' : 'global';
      if(data.theme==='dark' || data.theme==='light'){
        state.theme = data.theme;
        document.documentElement.setAttribute('data-theme', state.theme);
      }
      state.ui.fichaError=null;
      render();
    }catch(err){
      state.activeStep=0;
      state.ui.fichaError='El archivo no es un JSON válido de Circularia.';
      render();
    }
  };
  reader.readAsText(file);
}

function handleResetRequest(){ state.ui.confirmingReset=true; render(); }
function handleResetCancel(){ state.ui.confirmingReset=false; render(); }
function handleResetConfirm(){
  const theme = state.theme;
  state = createInitialState();
  state.theme = theme;
  document.documentElement.setAttribute('data-theme', state.theme);
  render();
}

function bindEvents(){
  const appEl = document.getElementById('app');

  appEl.addEventListener('click', (e)=>{
    const chip = e.target.closest('.chip[role="radio"]');
    if(chip){ handleChipSelect(chip); return; }
    const step = e.target.closest('.step[data-step]');
    if(step){ handleStepClick(Number(step.dataset.step)); return; }
    const seg = e.target.closest('.seg-btn[data-view]');
    if(seg){ handleViewChange(seg.dataset.view); return; }
    if(e.target.closest('#btnNext')){ handleNext(); return; }
    if(e.target.closest('#btnPrev')){ handlePrev(); return; }
    const removeTag = e.target.closest('.hashtag-remove');
    if(removeTag){ handleRemoveHashtag(removeTag.dataset.tag); return; }
    if(e.target.closest('#btnExport')){ handleExport(); return; }
    if(e.target.closest('#btnImport')){ document.getElementById('fileImport').click(); return; }
    if(e.target.closest('#btnReset')){ handleResetRequest(); return; }
    if(e.target.closest('#btnResetConfirm')){ handleResetConfirm(); return; }
    if(e.target.closest('#btnResetCancel')){ handleResetCancel(); return; }
    if(e.target.closest('#btnReport')){ handleGenerateReport(); return; }
    if(e.target.closest('#themeToggle')){ handleThemeToggle(); return; }
  });

  appEl.addEventListener('keydown', (e)=>{
    if(e.target && e.target.id==='hashtagInput'){
      if(e.key==='Enter' || e.key===',' || e.key===' '){
        e.preventDefault();
        commitHashtag(e.target.value);
        e.target.value='';
      } else if(e.key==='Backspace' && e.target.value===''){
        removeLastHashtag();
      }
      return;
    }
    const chip = e.target.closest ? e.target.closest('.chip[role="radio"]') : null;
    if(chip && ['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'].includes(e.key)){
      e.preventDefault();
      const group = chip.closest('.chip-group');
      const chips = Array.from(group.querySelectorAll('.chip'));
      const idx = chips.indexOf(chip);
      const dir = (e.key==='ArrowRight'||e.key==='ArrowDown') ? 1 : -1;
      const nextChip = chips[(idx+dir+chips.length)%chips.length];
      handleChipSelect(nextChip);
    }
  });

  appEl.addEventListener('input', (e)=>{
    if(e.target.id==='inputNombre'){
      state.ficha.nombre = e.target.value;
      if(state.ui.fichaError && fichaValid()){
        state.ui.fichaError=null;
        const el=document.querySelector('.form-error');
        if(el) el.remove();
      }
      renderHeader();
      return;
    }
    if(e.target.id==='inputEquipo'){ state.ficha.equipo = e.target.value; return; }
  });

  appEl.addEventListener('change', (e)=>{
    if(e.target.id==='fileImport'){ handleImportFile(e.target.files[0]); e.target.value=''; }
  });
}

    + '.dim-summary{display:flex;gap:16px;margin-bottom:24px;}.dim-summary div{border:1px solid #111214;padding:10px 14px;flex:1;}'
    + '.critical-list{padding-left:18px;}'
    + '@media print{@page{size:A4;margin:15mm;}body{padding:0;background:#fff;}.report-section{break-inside:avoid;}}'
    + '</style></head><body>'
    + '<header class="report-header"><h1>'+escapeHtml(f.nombre||'Proyecto sin nombre')+'</h1>'
    + '<p class="report-meta">'+escapeHtml(f.equipo||'—')+' · Reporte generado el '+fecha+'</p>'
    + '<div class="chip-list"><span>'+escapeHtml(categoriaLabel('tipoProducto', f.categorias.tipoProducto))+'</span>'
    + '<span>'+escapeHtml(categoriaLabel('escala', f.categorias.escala))+'</span>'
    + '<span>'+escapeHtml(categoriaLabel('mercado', f.categorias.mercado))+'</span></div>'
    + '<div class="hashtags">'+f.hashtags.map(t=>'<span>#'+escapeHtml(t)+'</span>').join('')+'</div></header>'
    + '<section class="report-section"><h2>Araña global</h2><img src="'+radarImg+'" alt="Gráfico de araña global" style="max-width:420px;display:block;"></section>'
    + '<section class="report-section"><h2>Variación por etapa</h2><div class="charts-row">'+barImgsHtml+'</div></section>'
    + '<section class="report-section"><h2>Resumen por dimensión</h2><div class="dim-summary">'
    + '<div><strong>Ambiental</strong><br>'+(dimDelta.env>0?'+':'')+Math.round(dimDelta.env*10)/10+'</div>'
    + '<div><strong>Económica</strong><br>'+(dimDelta.eco>0?'+':'')+Math.round(dimDelta.eco*10)/10+'</div>'
    + '<div><strong>Social</strong><br>'+(dimDelta.soc>0?'+':'')+Math.round(dimDelta.soc*10)/10+'</div>'
    + '</div></section>'
    + '<section class="report-section"><h2>Puntos críticos</h2>'
    + (critical.length ? '<ol class="critical-list">'+critical.map(c=>'<li>'+escapeHtml(c.stageLabel)+' — '+escapeHtml(c.decisionLabel)+': '+escapeHtml(c.optionLabel)+' (+'+c.score+')</li>').join('')+'</ol>' : '<p>No hay decisiones que expandan el polígono.</p>')
    + '</section>'
    + stageRows
    + '<script>(function(){var imgs=Array.prototype.slice.call(document.images);var pending=imgs.length;function ready(){pending--;if(pending<=0){window.print();}}if(pending===0){window.print();}imgs.forEach(function(img){if(img.complete){ready();}else{img.addEventListener("load",ready);img.addEventListener("error",ready);}});})();<\/script>'
    + '</body></html>';
}

function handleGenerateReport(){
  if(!charts.resultRadar) return;
  const radarImg = charts.resultRadar.toBase64Image();
  const barImgs = STAGES.map(st=>({ label: st.label, src: charts.bars[st.id] ? charts.bars[st.id].toBase64Image() : '' }));
  const html = buildReportHTML(radarImg, barImgs);
  const win = window.open('', '_blank');
  if(!win) return;
  win.document.open();
  win.document.write(html);
  win.document.close();
}

/* ============ INIT ============ */
document.documentElement.setAttribute('data-theme', state.theme);
bindEvents();
render();
</script>
</body>
</html>
